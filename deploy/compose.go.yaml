# Go variant of compose.yaml (opt-in): same topology, built from
# deploy/go.Dockerfile and driven by the persona binary instead of Node.
services:
  app:
    build:
      context: ..
      dockerfile: deploy/go.Dockerfile
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ["127.0.0.1:4310:4310"]
    env_file:
      - path: ../.env
        required: false
    environment:
      PERSONA_CONFIG: /control/persona.config.json
      PERSONA_PUBLIC_URL: ${PERSONA_PUBLIC_URL:-http://localhost:4310}
    volumes:
      - app-data:/data
      - control-data:/control
    networks: [default, control]
    tmpfs: [/tmp]
    stop_grace_period: 30s
    restart: unless-stopped
    depends_on:
      controller:
        condition: service_healthy
  controller:
    build:
      context: ..
      dockerfile: deploy/go.Dockerfile
    init: true
    user: "0:0"
    command: [controller, /control/controller.json]
    environment:
      # The rootfs is read-only; Buildx keeps its builder store under
      # DOCKER_CONFIG, which the tmpfs /tmp provides for installs.
      DOCKER_CONFIG: /tmp/docker-config
    volumes:
      - control-data:/control
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [control]
    read_only: true
    tmpfs: [/tmp]
    stop_grace_period: 30s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "persona", "controller", "health", "/control/controller.json"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  app-data:
  control-data:
networks:
  control:
    internal: true
