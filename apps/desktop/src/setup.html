<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'" />
    <title>Configurar Persona</title>
    <link rel="stylesheet" href="setup-theme.css" />
    <link rel="stylesheet" href="controls.css" />
    <link rel="stylesheet" href="setup-layout.css" />
    <link rel="stylesheet" href="setup.css" />
  </head>
  <body class="setup-window">
    <header class="titlebar"><img src="icon.png" alt="" /><span>Persona</span></header>
    <main class="setup-page">
      <div class="setup-content">
      <header class="setup-heading">
      <h1>Bem-vindo ao Persona</h1>
      <p>Escolha onde executar o Persona.</p>
      </header>
      <form id="setup" class="setup-form">
        <fieldset id="choices" class="choice-list">
          <legend class="sr-only">Modo de execução</legend>
          <label class="choice-card"><input name="mode" type="radio" value="local" checked /><span class="choice-content"><strong>Executar neste computador</strong><span class="choice-description">Seus Bots e dados ficam salvos aqui.</span></span></label>
          <label class="choice-card"><input name="mode" type="radio" value="existing" /><span class="choice-content"><strong>Conectar a um Persona existente</strong><span class="choice-description">Usar Bots e dados de outro computador ou servidor.</span></span></label>
        </fieldset>
        <fieldset id="local" class="choice-list">
          <legend>Ambiente local</legend>
          <label class="choice-card"><input name="runtime" type="radio" value="native" checked /><span class="choice-content"><strong>Execução direta</strong><span class="choice-description">Usa este computador diretamente, sem necessidade de Docker.</span></span></label>
          <label class="choice-card"><input name="runtime" type="radio" value="docker" /><span class="choice-content"><strong>Executar em Docker</strong><span class="choice-description">Requer Docker instalado e ativo.</span></span></label>
          <p class="detail-note">O ambiente de trabalho do Bot poderá ser configurado depois.</p>
        </fieldset>
        <section id="remote" class="setup-form" hidden>
          <div id="saved-label" class="field" hidden><span class="field-label">Conexões salvas</span><div id="saved" class="saved-connections"></div></div>
          <label class="field"><span class="field-label">Nome da conexão</span><input id="name" class="field-control" type="text" maxlength="80" value="Meu Persona" /></label>
          <label class="field"><span class="field-label">Endereço do Persona</span><input id="url" class="field-control" type="url" placeholder="https://persona.exemplo.com" spellcheck="false" /></label>
        </section>
        <div id="progress" class="connection-progress" role="status" aria-live="polite" hidden><progress></progress><span id="phase"></span></div>
        <p id="error" class="alert" role="alert" tabindex="-1" hidden></p>
        <button id="docker" type="button" class="button" data-variant="secondary" hidden>Instalar ou iniciar Docker Desktop</button>
        <div class="setup-actions"><button id="cancel" type="button" class="button" data-variant="secondary" hidden>Cancelar</button><button id="continue" type="submit" class="button" data-variant="primary">Continuar</button></div>
      </form>
      </div>
    </main>
    <script src="setup.js"></script>
  </body>
</html>
